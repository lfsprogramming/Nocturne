<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://*.supabase.co; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline';">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping — Nocturne</title>
<link rel="stylesheet" href="style.css">
<style>
#shop-wrap { max-width: 640px; margin: 0 auto; }
#controls {
  display: flex;
  gap: 0.8rem 1.4rem;
  flex-wrap: wrap;
  align-items: center;
  margin-bottom: 1rem;
}
#cat-select {
  background: var(--bg-card);
  border: 0.5px solid var(--border);
  color: var(--text);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px;
  padding: 9px 10px;
}
.opt-group { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.05em; color: var(--text-dim); }
.opt-group label { margin-right: 0.8rem; cursor: pointer; }
.opt-group input { accent-color: var(--gold); margin-right: 0.3rem; }
.opt-group .lead { color: var(--gold-dim); text-transform: uppercase; font-size: 10px; letter-spacing: 0.12em; margin-right: 0.6rem; }
#bar {
  position: sticky; top: 0; z-index: 5;
  display: flex; align-items: center; gap: 1rem;
  background: var(--bg);
  padding: 0.5rem 0;
  border-bottom: 0.5px solid var(--border);
  margin-bottom: 0.8rem;
  min-height: 2.6rem;
}
#status { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.06em; color: var(--text-dim); }
#status.err { color: #d0645c; }
#status.ok { color: var(--teal); }
#signout { margin-left: auto; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.08em; cursor: pointer; color: var(--text-dim); background: none; border: none; }
#signout:hover { color: var(--gold); }

#list { border: 0.5px solid var(--border); }
.row {
  display: flex;
  align-items: center;
  gap: 0.9rem;
  padding: 0.5rem 0.6rem;
  border-bottom: 0.5px solid var(--border);
}
.row:last-child { border-bottom: none; }
.tick {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-width: 3.4rem; min-height: 3rem;
  font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 0.1em;
  color: var(--text-dim); text-transform: uppercase; cursor: pointer; user-select: none;
}
.tick input { width: 22px; height: 22px; accent-color: var(--text); margin-bottom: 3px; cursor: pointer; }
.tick.cancel { opacity: 0.6; }
.main { flex: 1; min-width: 0; padding: 0.3rem 0; }
.name { font-size: 18px; line-height: 1.3; color: var(--text); }
.meta { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.04em; color: var(--text-dim); margin-top: 2px; }
.notes { font-size: 14px; color: var(--text-dim); font-style: italic; margin-top: 2px; }
.badge { display: inline-block; margin-left: 0.4rem; padding: 0 6px; border: 0.5px solid var(--gold-dim); color: var(--gold); }
.badge.over { border-color: #d0645c; color: #d0645c; }
.row.closed .name { text-decoration: line-through; color: var(--text-dim); }
.row.closed .badge { display: none; }
.undo { margin-left: 0.6rem; background: none; border: 0.5px solid var(--gold-dim); color: var(--gold); font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.08em; padding: 1px 8px; cursor: pointer; }
.row.busy { opacity: 0.55; pointer-events: none; }
#empty, #loading { padding: 1.5rem; color: var(--text-dim); font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.06em; line-height: 1.7; }

[hidden] { display: none !important; }

/* add form */
#add-panel { border: 0.5px solid var(--border); background: var(--bg-card); padding: 0.9rem; margin-bottom: 0.8rem; }
#add-panel > * + * { margin-top: 0.6rem; }
#add-panel input, #add-panel select {
  width: 100%;
  background: var(--bg);
  border: 0.5px solid var(--border);
  color: var(--text);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 16px;
  padding: 9px 10px;
  color-scheme: dark;
}
#add-panel input::placeholder { color: var(--text-faint); }
.field-row { display: flex; gap: 0.6rem; }
.field-row > * { flex: 1; min-width: 0; }
.field-row > .btn { flex: 0 0 auto; }
.form-buttons { display: flex; gap: 0.6rem; }
#add-msg { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.05em; color: var(--text-dim); min-height: 1.3em; line-height: 1.5; }
#add-msg.err { color: #d0645c; }
#add-msg.ok { color: var(--teal); }

/* login */
#login { max-width: 420px; margin: 2rem auto; }
#login p { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-dim); letter-spacing: 0.05em; margin-bottom: 1rem; line-height: 1.7; }
#login input { width: 100%; background: var(--bg-card); border: 0.5px solid var(--border); color: var(--text); font-family: 'IBM Plex Mono', monospace; font-size: 13px; padding: 10px 12px; margin-bottom: 1rem; }
.btn { white-space: nowrap; font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.08em; background: var(--bg-card); color: var(--gold); border: 0.5px solid var(--gold-dim); padding: 8px 16px; cursor: pointer; }
.btn:disabled { color: var(--text-faint); border-color: var(--border); cursor: default; }
#login-msg { min-height: 1.5em; margin-top: 1rem; margin-bottom: 0; }
#login-msg.err { color: #d0645c; }
#login-msg.ok { color: var(--teal); }
</style>
</head>
<body>

<script src="nav.js"></script>
<script src="auth.js"></script>

<div class="page-wrap">

  <div class="page-header">
    <h1>Shopping</h1>
    <p class="byline">what's still to buy — private, needs login</p>
  </div>

  <div id="login" hidden>
    <p>this list is private. enter your email and a sign-in link will be sent to it.</p>
    <input type="email" id="login-email" placeholder="email" autocomplete="email">
    <button class="btn" id="login-btn">send link</button>
    <p id="login-msg"></p>
  </div>

  <div id="shop-wrap" hidden>
    <div id="controls">
      <select id="cat-select"><option value="">All categories</option></select>
      <div class="opt-group">
        <span class="lead">sort</span>
        <label><input type="radio" name="sort" value="importance" checked>importance</label>
        <label><input type="radio" name="sort" value="deadline">deadline</label>
      </div>
      <div class="opt-group">
        <label><input type="checkbox" id="show-closed">show closed</label>
      </div>
    </div>

    <div id="bar">
      <button class="btn" id="add-toggle">+ add item</button>
      <span id="status"></span>
      <button id="signout">sign out</button>
    </div>

    <div id="add-panel" hidden>
      <input type="text" id="f-item" placeholder="item" maxlength="200" autocomplete="off">
      <div class="field-row">
        <input type="text" id="f-importance" inputmode="decimal" placeholder="importance" autocomplete="off">
        <input type="date" id="f-deadline" aria-label="deadline">
      </div>
      <div class="field-row">
        <input type="text" id="f-quantity" inputmode="decimal" placeholder="quantity" autocomplete="off">
        <select id="f-unit" aria-label="unit"><option value="">unit</option></select>
      </div>
      <div class="field-row" id="new-unit-row" hidden>
        <input type="text" id="f-new-unit" placeholder="new unit, e.g. cans" maxlength="40" autocomplete="off">
        <button class="btn" id="save-unit">save unit</button>
      </div>
      <select id="f-category" aria-label="category"><option value="">category</option></select>
      <input type="text" id="f-notes" placeholder="notes (optional)" autocomplete="off">
      <div id="add-msg"></div>
      <div class="form-buttons">
        <button class="btn" id="add-btn">add</button>
        <button class="btn" id="add-close">close</button>
      </div>
    </div>

    <div id="list"></div>
  </div>

</div>

<footer>nocturne &mdash; built slowly, in the dark</footer>

<script>
const UNDO_MS = 6000;
const SELECT = 'items?select=id,item,importance,deadline,quantity,notes,status,closed_on,created_at,category_id,category:categories(name),unit:quantity_types(name)';

let items = [];
let categories = [];
const recent = new Map();     // id -> timer; items just closed stay visible with an undo button
const busy = new Set();       // ids with a save in flight

/* ---------- helpers ---------- */

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

function getPref(key, fallback) {
  try { return localStorage.getItem('shop_' + key) || fallback; } catch (e) { return fallback; }
}
function setPref(key, value) {
  try { localStorage.setItem('shop_' + key, value); } catch (e) {}
}

function setStatus(text, kind) {
  const el = document.getElementById('status');
  el.textContent = text;
  el.className = kind || '';
}

function daysUntil(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const t = new Date(); t.setHours(0, 0, 0, 0);
  return Math.round((d - t) / 86400000);
}

function deadlineBadge(dateStr) {
  const days = daysUntil(dateStr);
  if (days < 0) return `<span class="badge over">overdue</span>`;
  if (days === 0) return `<span class="badge">today</span>`;
  if (days <= 5) return `<span class="badge">in ${days}d</span>`;
  return '';
}

function fmtDate(dateStr) {
  return new Date(dateStr + 'T00:00:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}

/* ---------- rendering ---------- */

function num(a, b) {                       // ascending, nulls last
  if (a == null && b == null) return 0;
  if (a == null) return 1;
  if (b == null) return -1;
  return a - b;
}

function sortedVisible() {
  const cat = document.getElementById('cat-select').value;
  const showClosed = document.getElementById('show-closed').checked;
  const mode = document.querySelector('input[name="sort"]:checked').value;

  let rows = items.filter(i => showClosed || i.status === 'open' || recent.has(i.id));
  if (cat) rows = rows.filter(i => String(i.category_id) === cat);

  const dl = i => (i.deadline ? new Date(i.deadline + 'T00:00:00').getTime() : null);
  const byCreated = (a, b) => a.created_at < b.created_at ? -1 : a.created_at > b.created_at ? 1 : 0;
  rows.sort((a, b) => {
    const open = (b.status === 'open') - (a.status === 'open');   // open items above closed ones
    if (open) return open;
    const primary = mode === 'deadline' ? num(dl(a), dl(b)) : num(a.importance, b.importance);
    if (primary) return primary;
    const secondary = mode === 'deadline' ? num(a.importance, b.importance) : num(dl(a), dl(b));
    return secondary || byCreated(a, b);
  });
  return rows;
}

function rowHtml(i) {
  const closed = i.status !== 'open';
  const qty = i.quantity != null ? (i.unit ? i.unit.name : 'qty') + ': ' + Number(i.quantity) : '';
  const meta = [
    qty,
    i.category ? i.category.name : '',
    i.importance != null ? '★ ' + Number(i.importance) : '',
    i.deadline ? 'due ' + fmtDate(i.deadline) : '',
  ].filter(Boolean).map(escapeHtml).join(' · ');
  const badge = !closed && i.deadline ? deadlineBadge(i.deadline) : '';
  const undo = recent.has(i.id) ? `<button class="undo" data-act="undo">undo</button>` : '';
  return `
  <div class="row${closed ? ' closed' : ''}${busy.has(i.id) ? ' busy' : ''}" data-id="${i.id}">
    <label class="tick"><input type="checkbox" data-act="bought"${i.status === 'bought' ? ' checked' : ''}>bought</label>
    <div class="main">
      <div class="name">${escapeHtml(i.item)}${undo}</div>
      <div class="meta">${meta}${badge}</div>
      ${i.notes ? `<div class="notes">${escapeHtml(i.notes)}</div>` : ''}
    </div>
    <label class="tick cancel"><input type="checkbox" data-act="cancelled"${i.status === 'cancelled' ? ' checked' : ''}>cancel</label>
  </div>`;
}

function render() {
  const listEl = document.getElementById('list');
  const rows = sortedVisible();
  if (!rows.length) {
    listEl.innerHTML = '<div id="empty">nothing to buy right now.<br>new items are added through Claude for now.</div>';
    return;
  }
  listEl.innerHTML = rows.map(rowHtml).join('');
}

/* ---------- saving ---------- */

// One tap = one save. The row updates immediately and rolls back if Supabase doesn't confirm.
async function changeStatus(id, next) {
  const item = items.find(i => i.id === id);
  if (!item || busy.has(id) || item.status === next) return;
  const prev = item.status;
  busy.add(id);
  item.status = next;
  if (next !== 'open') {
    clearTimeout(recent.get(id));
    recent.set(id, setTimeout(() => { recent.delete(id); render(); }, UNDO_MS));
  } else {
    clearTimeout(recent.get(id)); recent.delete(id);
  }
  render();
  try {
    const rows = await NAuth.rest('shopping', 'items?id=eq.' + encodeURIComponent(id),
      { method: 'PATCH', body: { status: next }, prefer: 'return=representation' });
    if (!Array.isArray(rows) || rows.length !== 1 || rows[0].status !== next) throw new Error('not saved (no permission?)');
    item.closed_on = rows[0].closed_on;
    setStatus(next === 'open' ? '✓ reopened: ' + item.item : '✓ ' + next + ': ' + item.item, 'ok');
  } catch (e) {
    item.status = prev;
    clearTimeout(recent.get(id)); recent.delete(id);
    if (e.code === 'auth') { showLogin('session expired — request a new link.', 'err'); }
    else setStatus('could not save "' + item.item + '": ' + e.message, 'err');
  }
  busy.delete(id);
  render();
}

/* ---------- adding items and units ---------- */

let units = [];
let adding = false;
let dupConfirmed = false;

function setAddMsg(text, kind) {
  const el = document.getElementById('add-msg');
  el.textContent = text;
  el.className = kind || '';
}

function fillCategorySelects() {
  for (const id of ['cat-select', 'f-category']) {
    const sel = document.getElementById(id);
    for (const c of categories) {
      const o = document.createElement('option');
      o.value = c.id; o.textContent = c.name; sel.appendChild(o);
    }
  }
}

function fillUnitSelect(selectId) {
  const sel = document.getElementById('f-unit');
  sel.innerHTML = '<option value="">unit</option>'
    + units.map(u => `<option value="${u.id}">${escapeHtml(u.name)}</option>`).join('')
    + '<option value="__new">+ new unit…</option>';
  sel.value = selectId ? String(selectId) : '';
}

function norm(s) {
  return s.toLowerCase().replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim().replace(/^the /, '');
}

// Titles alias easily ("the", punctuation, one name inside another), so warn before adding a near-duplicate.
function similarItems(name) {
  const n = norm(name);
  if (!n) return [];
  return items.filter(i => i.status === 'open').filter(i => {
    const m = norm(i.item);
    return m === n || (n.length >= 4 && m.length >= 4 && (m.includes(n) || n.includes(m)));
  });
}

function resetForm() {
  for (const id of ['f-item', 'f-importance', 'f-deadline', 'f-quantity', 'f-new-unit', 'f-notes']) {
    document.getElementById(id).value = '';
  }
  document.getElementById('f-category').value = '';
  fillUnitSelect(null);
  document.getElementById('new-unit-row').hidden = true;
  dupConfirmed = false;
  document.getElementById('add-btn').textContent = 'add';
}

function authExpired(e) {
  if (e.code === 'auth') { showLogin('session expired — request a new link.', 'err'); return true; }
  return false;
}

async function addItem() {
  if (adding) return;
  const name = document.getElementById('f-item').value.trim();
  const imp = document.getElementById('f-importance').value.trim();
  const qty = document.getElementById('f-quantity').value.trim();
  const problems = [];
  if (!name) problems.push('item name is required');
  if (imp && !/^\d{1,2}(\.\d+)?$/.test(imp)) problems.push('importance must be a number like 0.5');
  if (qty && !(/^\d+(\.\d+)?$/.test(qty) && Number(qty) > 0)) problems.push('quantity must be a positive number');
  if (problems.length) { setAddMsg(problems.join('; '), 'err'); return; }

  const dups = similarItems(name);
  if (dups.length && !dupConfirmed) {
    dupConfirmed = true;
    document.getElementById('add-btn').textContent = 'add anyway';
    setAddMsg('already on the list: ' + dups.map(d => d.item).join(', ') + ' — press "add anyway" to add it regardless', 'err');
    return;
  }

  const body = { item: name };
  if (imp) body.importance = Number(imp);
  const deadline = document.getElementById('f-deadline').value;
  if (deadline) body.deadline = deadline;
  if (qty) body.quantity = Number(qty);
  const unit = document.getElementById('f-unit').value;
  if (unit && unit !== '__new') body.quantity_type_id = Number(unit);
  const cat = document.getElementById('f-category').value;
  if (cat) body.category_id = Number(cat);
  const notes = document.getElementById('f-notes').value.trim();
  if (notes) body.notes = notes;

  adding = true;
  document.getElementById('add-btn').disabled = true;
  setAddMsg('adding…');
  try {
    const rows = await NAuth.rest('shopping', SELECT, { method: 'POST', body, prefer: 'return=representation' });
    if (!Array.isArray(rows) || rows.length !== 1 || rows[0].item !== name) throw new Error('not saved (no permission?)');
    items.push(rows[0]);
    resetForm();
    render();
    const shown = !!document.querySelector(`.row[data-id="${rows[0].id}"]`);
    setAddMsg('');
    setStatus('✓ added: ' + name + (shown ? '' : ' (hidden by the current filter)'), 'ok');
    document.getElementById('f-item').focus();
  } catch (e) {
    if (!authExpired(e)) setAddMsg('could not add: ' + e.message, 'err');
  }
  adding = false;
  document.getElementById('add-btn').disabled = false;
}

async function saveUnit() {
  const name = document.getElementById('f-new-unit').value.trim();
  if (!name) { setAddMsg('type a unit name first', 'err'); return; }
  const existing = units.find(u => u.name.toLowerCase() === name.toLowerCase());
  if (existing) {
    fillUnitSelect(existing.id);
    document.getElementById('new-unit-row').hidden = true;
    document.getElementById('f-new-unit').value = '';
    setAddMsg('"' + existing.name + '" already exists — selected it', 'ok');
    return;
  }
  try {
    const rows = await NAuth.rest('shopping', 'quantity_types?select=id,name',
      { method: 'POST', body: { name }, prefer: 'return=representation' });
    if (!Array.isArray(rows) || rows.length !== 1) throw new Error('not saved (no permission?)');
    units.push(rows[0]);
    units.sort((a, b) => a.name.localeCompare(b.name));
    fillUnitSelect(rows[0].id);
    document.getElementById('new-unit-row').hidden = true;
    document.getElementById('f-new-unit').value = '';
    setAddMsg('✓ unit added: ' + name, 'ok');
  } catch (e) {
    if (!authExpired(e)) setAddMsg('could not add unit: ' + e.message, 'err');
  }
}

/* ---------- login ---------- */

function showLogin(msg, kind) {
  document.getElementById('shop-wrap').hidden = true;
  document.getElementById('login').hidden = false;
  setLoginMsg(msg || '', kind);
}
function setLoginMsg(msg, kind) {
  const el = document.getElementById('login-msg');
  el.textContent = msg;
  el.className = kind || '';
}
async function sendLink() {
  const email = document.getElementById('login-email').value.trim();
  if (!email) return;
  const btn = document.getElementById('login-btn');
  btn.disabled = true;
  setLoginMsg('sending…');
  try {
    await NAuth.sendLink(email);
    setLoginMsg('link sent — open it on this device.', 'ok');
  } catch (e) {
    setLoginMsg('could not send link: ' + e.message, 'err');
  }
  btn.disabled = false;
}

/* ---------- events ---------- */

const listEl = document.getElementById('list');
listEl.addEventListener('change', e => {
  const act = e.target.dataset && e.target.dataset.act;
  if (act !== 'bought' && act !== 'cancelled') return;
  const id = Number(e.target.closest('.row').dataset.id);
  changeStatus(id, e.target.checked ? act : 'open');
});
listEl.addEventListener('click', e => {
  if (e.target.dataset && e.target.dataset.act === 'undo') {
    changeStatus(Number(e.target.closest('.row').dataset.id), 'open');
  }
});

document.getElementById('add-toggle').addEventListener('click', () => {
  const panel = document.getElementById('add-panel');
  panel.hidden = !panel.hidden;
  if (!panel.hidden) document.getElementById('f-item').focus();
});
document.getElementById('add-close').addEventListener('click', () => { document.getElementById('add-panel').hidden = true; });
document.getElementById('add-btn').addEventListener('click', addItem);
document.getElementById('save-unit').addEventListener('click', saveUnit);
document.getElementById('f-item').addEventListener('input', () => {
  dupConfirmed = false;
  document.getElementById('add-btn').textContent = 'add';
});
document.getElementById('f-item').addEventListener('keydown', e => { if (e.key === 'Enter') addItem(); });
document.getElementById('f-new-unit').addEventListener('keydown', e => { if (e.key === 'Enter') saveUnit(); });
document.getElementById('f-unit').addEventListener('change', e => {
  const isNew = e.target.value === '__new';
  document.getElementById('new-unit-row').hidden = !isNew;
  if (isNew) document.getElementById('f-new-unit').focus();
});

document.getElementById('cat-select').addEventListener('change', render);
document.getElementById('show-closed').addEventListener('change', render);
document.querySelectorAll('input[name="sort"]').forEach(el => el.addEventListener('change', () => {
  setPref('sort', el.value);
  render();
}));

document.getElementById('login-btn').addEventListener('click', sendLink);
document.getElementById('login-email').addEventListener('keydown', e => { if (e.key === 'Enter') sendLink(); });
document.getElementById('signout').addEventListener('click', () => { NAuth.signOut(); location.reload(); });

/* ---------- start ---------- */

(async function init() {
  const hashError = NAuth.consumeHash();
  if (!NAuth.hasSession()) {
    showLogin(hashError ? 'sign-in failed: ' + hashError : '', hashError ? 'err' : '');
    return;
  }
  try { await NAuth.getToken(); } catch (e) { showLogin('session expired — request a new link.', 'err'); return; }

  document.getElementById('shop-wrap').hidden = false;
  const saved = getPref('sort', 'importance');
  const radio = document.querySelector(`input[name="sort"][value="${saved}"]`);
  if (radio) radio.checked = true;

  listEl.innerHTML = '<div id="loading">loading…</div>';
  try {
    [categories, items, units] = await Promise.all([
      NAuth.rest('shopping', 'categories?select=id,name&order=name'),
      NAuth.rest('shopping', SELECT),
      NAuth.rest('shopping', 'quantity_types?select=id,name&order=name'),
    ]);
    fillCategorySelects();
    fillUnitSelect(null);
    render();
  } catch (e) {
    if (e.code === 'auth') { showLogin('session expired — request a new link.', 'err'); return; }
    listEl.innerHTML = `<div id="empty">failed to load: ${escapeHtml(e.message)}</div>`;
  }
})();
</script>

</body>
</html>
