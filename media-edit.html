<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://*.supabase.co; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline';">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Media — Nocturne</title>
<link rel="stylesheet" href="style.css">
<style>
#media-wrap { max-width: 640px; margin: 0 auto; }
.page-header { position: relative; }
#back-link {
  position: absolute;
  right: 0;
  top: 0.6rem;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.1em;
}
#type-select {
  width: 100%;
  background: var(--bg-card);
  border: 0.5px solid var(--border);
  color: var(--text);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px;
  letter-spacing: 0.05em;
  padding: 10px 12px;
  margin-bottom: 2rem;
}
#search-box {
  width: 100%;
  background: var(--bg-card);
  border: 0.5px solid var(--border);
  color: var(--text);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px;
  letter-spacing: 0.05em;
  padding: 10px 12px;
  margin-bottom: 1rem;
}
#search-box::placeholder { color: var(--text-faint); }
#filters {
  display: flex;
  gap: 2rem;
  margin-bottom: 1.5rem;
  flex-wrap: wrap;
}
.filter-group {
  border: 0.5px solid var(--border);
  padding: 0.5rem 0.9rem;
}
.filter-group legend {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.12em;
  color: var(--gold-dim);
  text-transform: uppercase;
  padding: 0 0.4rem;
}
.filter-group label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: var(--text-dim);
  letter-spacing: 0.05em;
  margin-right: 1rem;
  cursor: pointer;
}
.filter-group input { accent-color: var(--gold); margin-right: 0.3rem; }

/* save / cancel bar */
#edit-bar {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  gap: 0.8rem;
  flex-wrap: wrap;
  background: var(--bg);
  padding: 0.7rem 0;
  margin-bottom: 0.8rem;
  border-bottom: 0.5px solid var(--border);
}
.btn {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  letter-spacing: 0.08em;
  background: var(--bg-card);
  color: var(--gold);
  border: 0.5px solid var(--gold-dim);
  padding: 8px 16px;
  cursor: pointer;
}
.btn:hover:not(:disabled) { border-color: var(--gold); }
.btn:disabled { color: var(--text-faint); border-color: var(--border); cursor: default; }
#status {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.06em;
  color: var(--text-dim);
}
#status.pending { color: var(--gold); }
#status.ok { color: var(--teal); }
#status.err { color: #d0645c; }

#media-list { border: 0.5px solid var(--border); }
.media-row {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.4rem 0.8rem;
  padding: 0.6rem 1.2rem;
  border-bottom: 0.5px solid var(--border);
}
.media-row:last-child { border-bottom: none; }
.media-row .m-title { color: var(--text); font-size: 17px; flex: 1 1 12rem; min-width: 0; }
.cell {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  letter-spacing: 0.05em;
  color: var(--text-dim);
  background: transparent;
  border: 0.5px solid var(--border);
  padding: 3px 6px;
}
.score-in { width: 3.6rem; }
.score-in::placeholder { color: var(--text-faint); }
.flag { cursor: pointer; white-space: nowrap; user-select: none; }
.flag input { accent-color: var(--text); margin-right: 0.35rem; }   /* ticked = neutral; gold is reserved for "changed" */
.cell.changed {
  background: rgba(200, 169, 110, 0.32);
  color: var(--gold);
  border-color: var(--gold);
  box-shadow: inset 3px 0 0 var(--gold);
}
.cell.invalid { border-color: #d0645c; color: #d0645c; }
#media-empty, #media-loading {
  padding: 1.5rem;
  color: var(--text-dim);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  letter-spacing: 0.06em;
}

/* add title */
#add-panel { border: 0.5px solid var(--border); background: var(--bg-card); padding: 0.9rem; margin-bottom: 0.8rem; }
#add-panel > * + * { margin-top: 0.6rem; }
#add-panel input[type="text"], #add-panel select {
  width: 100%;
  background: var(--bg);
  border: 0.5px solid var(--border);
  color: var(--text);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 16px;
  padding: 9px 10px;
  color-scheme: dark;
}
#add-panel input::placeholder { color: var(--text-faint); }
.field-row { display: flex; gap: 0.6rem; }
.field-row > * { flex: 1; min-width: 0; }
.form-buttons { display: flex; gap: 0.6rem; }
#add-msg { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.05em; color: var(--text-dim); min-height: 1.3em; line-height: 1.5; }
#add-msg.err { color: #d0645c; }
#add-msg.ok { color: var(--teal); }

/* login */
#login { max-width: 420px; margin: 2rem auto; }
#login p { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-dim); letter-spacing: 0.05em; margin-bottom: 1rem; line-height: 1.7; }
#login input {
  width: 100%;
  background: var(--bg-card);
  border: 0.5px solid var(--border);
  color: var(--text);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px;
  padding: 10px 12px;
  margin-bottom: 1rem;
}
#login-msg { min-height: 1.5em; margin-top: 1rem; margin-bottom: 0; }
#login-msg.err { color: #d0645c; }
#login-msg.ok { color: var(--teal); }
#signout { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.08em; margin-left: auto; cursor: pointer; color: var(--text-dim); background: none; border: none; }
#signout:hover { color: var(--gold); }
</style>
</head>
<body>

<script src="nav.js"></script>

<div class="page-wrap">

  <div class="page-header">
    <h1>Media</h1>
    <p class="byline">editing — interest score, MKV, MP4</p>
    <a id="back-link" href="media.html">← view</a>
  </div>

  <div id="login" hidden>
    <p>editing needs a login. enter your email and a sign-in link will be sent to it.</p>
    <input type="email" id="login-email" placeholder="email" autocomplete="email">
    <button class="btn" id="login-btn">send link</button>
    <p id="login-msg"></p>
  </div>

  <div id="media-wrap" hidden>
    <select id="type-select">
      <option value="">All types</option>
    </select>
    <input type="text" id="search-box" placeholder="search titles…">

    <div id="filters">
      <fieldset class="filter-group">
        <legend>MKV</legend>
        <label><input type="radio" name="mkv-filter" value="" checked> off</label>
        <label><input type="radio" name="mkv-filter" value="true"> true</label>
        <label><input type="radio" name="mkv-filter" value="false"> false</label>
      </fieldset>
      <fieldset class="filter-group">
        <legend>MP4 (Jellyfin)</legend>
        <label><input type="radio" name="jf-filter" value="" checked> off</label>
        <label><input type="radio" name="jf-filter" value="true"> true</label>
        <label><input type="radio" name="jf-filter" value="false"> false</label>
      </fieldset>
    </div>

    <div id="edit-bar">
      <button class="btn" id="add-toggle">+ add title</button>
      <button class="btn" id="save-btn" disabled>save</button>
      <button class="btn" id="cancel-btn" disabled>cancel</button>
      <span id="status"></span>
      <button id="signout">sign out</button>
    </div>

    <div id="add-panel" hidden>
      <input type="text" id="a-title" placeholder="title" maxlength="300" autocomplete="off">
      <div class="field-row">
        <select id="a-type" aria-label="type"><option value="">type (optional)</option></select>
        <input type="text" id="a-score" inputmode="decimal" placeholder="interest score" autocomplete="off">
      </div>
      <div class="field-row">
        <label class="cell flag"><input type="checkbox" id="a-mkv">MKV</label>
        <label class="cell flag"><input type="checkbox" id="a-jf">MP4 (Jellyfin)</label>
      </div>
      <div id="add-msg"></div>
      <div class="form-buttons">
        <button class="btn" id="add-title-btn">add</button>
        <button class="btn" id="add-close">close</button>
      </div>
    </div>

    <div id="media-list"></div>
  </div>

</div>

<footer>nocturne &mdash; built slowly, in the dark</footer>

<script>
const SUPABASE_URL = 'https://rthghgzdwqnlzvsoerhz.supabase.co';
const SUPABASE_KEY = 'sb_publishable_RvrKhg03c_vSx1wYwpSNFw_oRVuTVCQ';
const SESSION_KEY = 'nocturne_media_session';
const PATCH_CHUNK = 8;

/* ---------- session (magic link, raw REST — no client library) ---------- */

function loadSession() {
  try { return JSON.parse(localStorage.getItem(SESSION_KEY)); } catch (e) { return null; }
}
function storeSession(s) {
  try { localStorage.setItem(SESSION_KEY, JSON.stringify(s)); } catch (e) {}
}
function clearSession() {
  try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
}

async function authPost(path, body) {
  const res = await fetch(SUPABASE_URL + '/auth/v1/' + path, {
    method: 'POST',
    headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.msg || data.error_description || data.message || ('HTTP ' + res.status));
  return data;
}

// The magic link lands back here with the tokens in the URL fragment.
function consumeHash() {
  if (!location.hash) return null;
  const p = new URLSearchParams(location.hash.slice(1));
  let error = null;
  if (p.get('error_description')) error = p.get('error_description').replace(/\+/g, ' ');
  else if (p.get('access_token') && p.get('refresh_token')) {
    const exp = Number(p.get('expires_at')) || (Math.floor(Date.now() / 1000) + Number(p.get('expires_in') || 3600));
    storeSession({ access_token: p.get('access_token'), refresh_token: p.get('refresh_token'), expires_at: exp });
  } else {
    return null;
  }
  history.replaceState(null, '', location.pathname + location.search);
  return error;
}

async function getToken() {
  let s = loadSession();
  if (!s) throw new Error('not signed in');
  if (s.expires_at - Date.now() / 1000 < 60) {
    try {
      const d = await authPost('token?grant_type=refresh_token', { refresh_token: s.refresh_token });
      s = {
        access_token: d.access_token,
        refresh_token: d.refresh_token,
        expires_at: d.expires_at || (Math.floor(Date.now() / 1000) + d.expires_in),
      };
      storeSession(s);
    } catch (e) {
      clearSession();
      showLogin('session expired — request a new link.', 'err');
      throw e;
    }
  }
  return s.access_token;
}

function showLogin(msg, kind) {
  document.getElementById('media-wrap').hidden = true;
  document.getElementById('login').hidden = false;
  setLoginMsg(msg || '', kind);
}
function setLoginMsg(msg, kind) {
  const el = document.getElementById('login-msg');
  el.textContent = msg;
  el.className = kind || '';
}

async function sendLink() {
  const email = document.getElementById('login-email').value.trim();
  if (!email) return;
  const btn = document.getElementById('login-btn');
  btn.disabled = true;
  setLoginMsg('sending…');
  try {
    const redirect = location.origin + location.pathname;
    await authPost('otp?redirect_to=' + encodeURIComponent(redirect), { email, create_user: false });
    setLoginMsg('link sent — open it on this device.', 'ok');
  } catch (e) {
    setLoginMsg('could not send link: ' + e.message, 'err');
  }
  btn.disabled = false;
}

/* ---------- data ---------- */

async function sbFetch(path) {
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, {
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY,
      'Accept-Profile': 'media',
    },
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

// Sends one row's changes as the signed-in user and checks Supabase's confirmation.
// RLS silently updates zero rows when a write isn't allowed, so an empty reply is a failure.
async function patchRow(id, fields, token) {
  const res = await fetch(SUPABASE_URL + '/rest/v1/titles?id=eq.' + encodeURIComponent(id), {
    method: 'PATCH',
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + token,
      'Content-Profile': 'media',
      'Accept-Profile': 'media',
      'Content-Type': 'application/json',
      'Prefer': 'return=representation',
    },
    body: JSON.stringify(fields),
  });
  if (!res.ok) {
    let msg = 'HTTP ' + res.status;
    try { const j = await res.json(); msg = j.message || j.msg || msg; } catch (e) {}
    throw new Error(msg);
  }
  const rows = await res.json();
  if (!Array.isArray(rows) || rows.length !== 1) throw new Error('not saved (no permission?)');
  for (const k of Object.keys(fields)) {
    if (rows[0][k] !== fields[k]) throw new Error('saved value does not match');
  }
}

// Inserts one new title row as the signed-in user. RLS silently inserts nothing when a
// write isn't allowed, so an empty reply is a failure, same as patchRow.
async function insertRow(fields, token) {
  const res = await fetch(SUPABASE_URL + '/rest/v1/titles', {
    method: 'POST',
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + token,
      'Content-Profile': 'media',
      'Accept-Profile': 'media',
      'Content-Type': 'application/json',
      'Prefer': 'return=representation',
    },
    body: JSON.stringify(fields),
  });
  if (!res.ok) {
    let msg = 'HTTP ' + res.status;
    try { const j = await res.json(); msg = j.message || j.msg || msg; } catch (e) {}
    throw new Error(msg);
  }
  const rows = await res.json();
  if (!Array.isArray(rows) || rows.length !== 1) throw new Error('not saved (no permission?)');
  return rows[0];
}

let mediaTypes = [];
let allTitles = [];
let byId = new Map();

async function loadTypes() {
  mediaTypes = await sbFetch('media_types?select=id,name&order=name');
  const select = document.getElementById('type-select');
  for (const t of mediaTypes) {
    const opt = document.createElement('option');
    opt.value = t.id;
    opt.textContent = t.name;
    select.appendChild(opt);
  }
  fillAddTypeSelect();
}

async function loadAllTitles() {
  allTitles = await sbFetch('titles?select=id,title,interest_score,media_type_id,has_mkv,in_jellyfin&order=interest_score.asc.nullslast');
  byId = new Map(allTitles.map(r => [String(r.id), r]));
}

/* ---------- adding a title ---------- */

let adding = false;
let dupConfirmed = false;

function setAddMsg(text, kind) {
  const el = document.getElementById('add-msg');
  el.textContent = text;
  el.className = kind || '';
}

function fillAddTypeSelect() {
  const sel = document.getElementById('a-type');
  sel.innerHTML = '<option value="">type (optional)</option>'
    + mediaTypes.map(t => `<option value="${t.id}">${escapeHtml(t.name)}</option>`).join('');
}

function norm(s) {
  return s.toLowerCase().replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim().replace(/^the /, '');
}

// Titles alias easily ("the", punctuation, one name inside another), so warn before adding a near-duplicate.
function similarTitles(name) {
  const n = norm(name);
  if (!n) return [];
  return allTitles.filter(r => {
    const m = norm(r.title);
    return m === n || (n.length >= 4 && m.length >= 4 && (m.includes(n) || n.includes(m)));
  });
}

function resetAddForm() {
  document.getElementById('a-title').value = '';
  document.getElementById('a-score').value = '';
  document.getElementById('a-type').value = '';
  document.getElementById('a-mkv').checked = false;
  document.getElementById('a-jf').checked = false;
  dupConfirmed = false;
  document.getElementById('add-title-btn').textContent = 'add';
}

async function addTitle() {
  if (adding) return;
  const name = document.getElementById('a-title').value.trim();
  const scoreText = document.getElementById('a-score').value.trim();
  const problems = [];
  if (!name) problems.push('title is required');
  const parsed = parseScore(scoreText);
  if (!parsed.ok) problems.push('interest score must be a number like 3 or 4.5');
  if (problems.length) { setAddMsg(problems.join('; '), 'err'); return; }

  const dups = similarTitles(name);
  if (dups.length && !dupConfirmed) {
    dupConfirmed = true;
    document.getElementById('add-title-btn').textContent = 'add anyway';
    setAddMsg('already on the list: ' + dups.slice(0, 5).map(d => d.title).join(', ')
      + (dups.length > 5 ? ', …' : '') + ' — press "add anyway" to add it regardless', 'err');
    return;
  }

  const fields = {
    title: name,
    has_mkv: document.getElementById('a-mkv').checked,
    in_jellyfin: document.getElementById('a-jf').checked,
  };
  if (parsed.value != null) fields.interest_score = parsed.value;
  const typeId = document.getElementById('a-type').value;
  if (typeId) fields.media_type_id = Number(typeId);

  adding = true;
  document.getElementById('add-title-btn').disabled = true;
  setAddMsg('adding…');
  try {
    const token = await getToken();
    await insertRow(fields, token);
    await loadAllTitles();   // re-run the query so the row lands in its real sort position
    resetAddForm();
    render();
    setAddMsg('');
    setStatus('✓ added: ' + name, 'ok');
    document.getElementById('a-title').focus();
  } catch (e) {
    if (e.code === 'auth') { showLogin('session expired — request a new link.', 'err'); }
    else setAddMsg('could not add: ' + e.message, 'err');
  }
  adding = false;
  document.getElementById('add-title-btn').disabled = false;
}

/* ---------- edit state ---------- */

const pending = new Map();   // id -> { field: newValue }
const invalid = new Set();   // ids whose score box holds something unparseable
let saving = false;

function effective(r, field) {
  const p = pending.get(String(r.id));
  return p && field in p ? p[field] : r[field];
}

function parseScore(text) {
  const t = text.trim();
  if (t === '') return { ok: true, value: null };
  if (!/^\d{1,2}(\.\d+)?$/.test(t)) return { ok: false };
  return { ok: true, value: Number(t) };
}

// Records a cell's value as a pending change, or drops it if it matches the original.
function setPending(id, field, value) {
  const orig = byId.get(id)[field];
  const same = (orig ?? null) === (value ?? null);
  let p = pending.get(id);
  if (same) {
    if (p) { delete p[field]; if (!Object.keys(p).length) pending.delete(id); }
  } else {
    if (!p) { p = {}; pending.set(id, p); }
    p[field] = value;
  }
  return !same;
}

function changeCount() {
  let n = 0;
  for (const p of pending.values()) n += Object.keys(p).length;
  return n;
}

function setStatus(text, kind) {
  const el = document.getElementById('status');
  el.textContent = text;
  el.className = kind || '';
}

function updateButtons() {
  const n = changeCount();
  document.getElementById('save-btn').disabled = saving || n === 0 || invalid.size > 0;
  document.getElementById('cancel-btn').disabled = saving || (n === 0 && invalid.size === 0);
}

function updateBar() {
  updateButtons();
  if (saving) return;
  const n = changeCount();
  if (invalid.size) setStatus('a score is not a number — fix it or cancel', 'err');
  else if (n) setStatus(n + ' unsaved change' + (n === 1 ? '' : 's'), 'pending');
}

/* ---------- rendering ---------- */

function radioValue(name) {
  return document.querySelector(`input[name="${name}"]:checked`).value;
}

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

function render() {
  const listEl = document.getElementById('media-list');
  const typeId = document.getElementById('type-select').value;
  const search = document.getElementById('search-box').value.trim().toLowerCase();
  const mkvFilter = radioValue('mkv-filter');
  const jfFilter = radioValue('jf-filter');

  // Filters look at the saved values, so a row doesn't vanish while you tick its box.
  let rows = allTitles;
  if (typeId) rows = rows.filter(r => String(r.media_type_id) === typeId);
  if (search) rows = rows.filter(r => r.title.toLowerCase().includes(search));
  if (mkvFilter) rows = rows.filter(r => !!r.has_mkv === (mkvFilter === 'true'));
  if (jfFilter) rows = rows.filter(r => !!r.in_jellyfin === (jfFilter === 'true'));

  if (!rows.length) {
    listEl.innerHTML = '<div id="media-empty">nothing here yet</div>';
    return;
  }

  listEl.innerHTML = rows.map(r => {
    const id = String(r.id);
    const p = pending.get(id) || {};
    const score = effective(r, 'interest_score');
    const mkv = effective(r, 'has_mkv');
    const jf = effective(r, 'in_jellyfin');
    return `
    <div class="media-row" data-id="${id}">
      <input class="cell score-in${'interest_score' in p ? ' changed' : ''}" data-field="interest_score"
             inputmode="decimal" placeholder="—" value="${score ?? ''}" aria-label="interest score">
      <span class="m-title">${escapeHtml(r.title)}</span>
      <label class="cell flag${'has_mkv' in p ? ' changed' : ''}"><input type="checkbox" data-field="has_mkv"${mkv ? ' checked' : ''}>MKV</label>
      <label class="cell flag${'in_jellyfin' in p ? ' changed' : ''}"><input type="checkbox" data-field="in_jellyfin"${jf ? ' checked' : ''}>MP4</label>
    </div>`;
  }).join('');
}

/* ---------- events ---------- */

function onCellEdit(e) {
  const el = e.target;
  const field = el.dataset && el.dataset.field;
  if (!field) return;
  const id = el.closest('.media-row').dataset.id;
  const cell = el.type === 'checkbox' ? el.closest('.flag') : el;

  let value;
  if (el.type === 'checkbox') {
    value = el.checked;
  } else {
    const parsed = parseScore(el.value);
    if (!parsed.ok) {
      invalid.add(id);
      cell.classList.add('invalid');
      updateBar();
      return;
    }
    invalid.delete(id);
    cell.classList.remove('invalid');
    value = parsed.value;
  }

  const changed = setPending(id, field, value);
  cell.classList.toggle('changed', changed);
  setStatus('');
  updateBar();
}

function cancelEdits() {
  pending.clear();
  invalid.clear();
  setStatus('');
  render();
  updateBar();
}

async function saveEdits() {
  if (saving || !pending.size || invalid.size) return;
  saving = true;
  setStatus('saving…', 'pending');
  updateButtons();

  const entries = [...pending.entries()];
  const failures = [];
  try {
    const token = await getToken();
    for (let i = 0; i < entries.length; i += PATCH_CHUNK) {
      const chunk = entries.slice(i, i + PATCH_CHUNK);
      const results = await Promise.allSettled(chunk.map(([id, fields]) => patchRow(id, fields, token)));
      results.forEach((r, j) => {
        const id = chunk[j][0];
        if (r.status === 'fulfilled') pending.delete(id);
        else failures.push({ id, message: r.reason.message });
      });
    }
  } catch (e) {
    saving = false;
    setStatus('could not save: ' + e.message, 'err');
    updateButtons();
    return;
  }

  // Re-run the same query so the table shows what Supabase actually holds now.
  try {
    await loadAllTitles();
  } catch (e) {
    failures.push({ id: null, message: 'saved, but could not reload: ' + e.message });
  }
  // A failed row keeps its edits; drop any that already match the fresh data.
  for (const [id, fields] of [...pending.entries()]) {
    const orig = byId.get(id);
    for (const k of Object.keys(fields)) if ((orig[k] ?? null) === (fields[k] ?? null)) delete fields[k];
    if (!Object.keys(fields).length) pending.delete(id);
  }

  saving = false;
  render();
  const total = entries.length;
  if (!failures.length) {
    setStatus('✓ changes saved', 'ok');
  } else {
    const names = failures.map(f => (f.id && byId.get(f.id) ? byId.get(f.id).title : '') + ' (' + f.message + ')').join('; ');
    setStatus((total - failures.length) + ' of ' + total + ' saved. failed: ' + names, 'err');
  }
  updateButtons();
}

document.getElementById('type-select').addEventListener('change', render);
document.getElementById('search-box').addEventListener('input', render);
document.querySelectorAll('input[name="mkv-filter"], input[name="jf-filter"]')
  .forEach(el => el.addEventListener('change', render));

const listEl = document.getElementById('media-list');
listEl.addEventListener('input', e => { if (e.target.type !== 'checkbox') onCellEdit(e); });
listEl.addEventListener('change', e => { if (e.target.type === 'checkbox') onCellEdit(e); });
listEl.addEventListener('focusin', e => { if (e.target.classList.contains('score-in')) e.target.select(); });

document.getElementById('save-btn').addEventListener('click', saveEdits);
document.getElementById('cancel-btn').addEventListener('click', cancelEdits);
document.getElementById('add-toggle').addEventListener('click', () => {
  const panel = document.getElementById('add-panel');
  panel.hidden = !panel.hidden;
  if (!panel.hidden) document.getElementById('a-title').focus();
});
document.getElementById('add-close').addEventListener('click', () => { document.getElementById('add-panel').hidden = true; });
document.getElementById('add-title-btn').addEventListener('click', addTitle);
document.getElementById('a-title').addEventListener('input', () => {
  dupConfirmed = false;
  document.getElementById('add-title-btn').textContent = 'add';
});
document.getElementById('a-title').addEventListener('keydown', e => { if (e.key === 'Enter') addTitle(); });
document.getElementById('login-btn').addEventListener('click', sendLink);
document.getElementById('login-email').addEventListener('keydown', e => { if (e.key === 'Enter') sendLink(); });
document.getElementById('signout').addEventListener('click', () => {
  if (changeCount() && !confirm('You have unsaved changes. Sign out anyway?')) return;
  pending.clear();
  clearSession();
  location.reload();
});
window.addEventListener('beforeunload', e => {
  if (changeCount()) { e.preventDefault(); e.returnValue = ''; }
});

(async function init() {
  const hashError = consumeHash();
  if (!loadSession()) {
    showLogin(hashError ? 'sign-in failed: ' + hashError : '', hashError ? 'err' : '');
    return;
  }
  try { await getToken(); } catch (e) { return; }   // showLogin already ran

  document.getElementById('media-wrap').hidden = false;
  listEl.innerHTML = '<div id="media-loading">loading…</div>';
  try {
    await loadTypes();
    await loadAllTitles();
    render();
  } catch (err) {
    listEl.innerHTML = `<div id="media-empty">failed to load: ${escapeHtml(err.message)}</div>`;
  }
})();
</script>
