<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://*.supabase.co; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline';">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clicker — Nocturne</title>
<link rel="stylesheet" href="style.css">
<style>
#wrap { max-width: 480px; margin: 0 auto; }
#bar {
  position: sticky; top: 0; z-index: 5;
  display: flex; align-items: center; gap: 0.8rem;
  background: var(--bg);
  padding: 0.5rem 0;
  border-bottom: 0.5px solid var(--border);
  margin-bottom: 0.9rem;
  min-height: 2.6rem;
}
#status { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.06em; color: var(--text-dim); }
#status.err { color: #d0645c; }
#status.ok { color: var(--teal); }
#signout { margin-left: auto; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.08em; cursor: pointer; color: var(--text-dim); background: none; border: none; }
#signout:hover { color: var(--gold); }
.btn { white-space: nowrap; font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.08em; background: var(--bg-card); color: var(--gold); border: 0.5px solid var(--gold-dim); padding: 8px 16px; cursor: pointer; }
.btn:disabled { color: var(--text-faint); border-color: var(--border); cursor: default; }
.btn.on { color: var(--bg); background: var(--gold); }
#plus-btn { font-size: 16px; line-height: 1; padding: 7px 14px; }

#filters { display: flex; flex-direction: column; gap: 0.4rem; margin-bottom: 0.9rem; }
#filters .f-row { display: flex; gap: 0.4rem; }
#filters .btn { flex: 1; padding: 7px 4px; font-size: 11px; }

#list { display: flex; flex-direction: column; gap: 0.6rem; }
.card {
  border: 0.5px solid var(--border);
  background: var(--bg-card);
  padding: 1.1rem 1.2rem;
  cursor: pointer;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.08s, border-color 0.15s;
}
.card:active { background: #16162a; }
.card.colored:active { filter: brightness(1.25); }
.card.light-bg .c-name { color: #16161c; }
.card.light-bg .c-tally, .card.light-bg .c-sub { color: #3a3a46; }
.card.flash { border-color: var(--gold); }
.card.edit-mode { border-color: var(--gold-dim); }
.card.busy { opacity: 0.5; pointer-events: none; }
.card-top { display: flex; align-items: baseline; justify-content: space-between; gap: 0.8rem; }
.c-name { font-size: 19px; color: var(--text); }
.c-per { margin-left: 0.5rem; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.04em; color: var(--text-dim); white-space: nowrap; }
.card.light-bg .c-per { color: #3a3a46; }
.c-tally { font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.04em; color: var(--gold-dim); white-space: nowrap; }
.c-sub { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.04em; color: var(--text-dim); margin-top: 3px; }
.c-undo { margin-left: 0.6rem; background: none; border: 0.5px solid var(--gold-dim); color: var(--gold); font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.08em; padding: 1px 8px; cursor: pointer; }

.edit-panel { margin-top: 0.8rem; padding-top: 0.8rem; border-top: 0.5px solid var(--border); cursor: default; }
.edit-panel > * + * { margin-top: 0.55rem; }
.edit-panel input, .edit-panel select {
  width: 100%;
  background: var(--bg);
  border: 0.5px solid var(--border);
  color: var(--text);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 15px;
  padding: 8px 9px;
  color-scheme: dark;
}
.swatches { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; }
.swatch { width: 30px; height: 30px; padding: 0; border: 0.5px solid var(--border); cursor: pointer; }
.swatch.none { background: linear-gradient(135deg, var(--bg) 46%, #d0645c 46%, #d0645c 54%, var(--bg) 54%); }
.swatch.sel { outline: 2px solid var(--gold); outline-offset: 2px; }
.edit-panel input.e-color-custom { width: 30px; height: 30px; padding: 0; border: 0.5px solid var(--border); background: none; cursor: pointer; }
.field-row { display: flex; gap: 0.6rem; }
.field-row > * { flex: 1; min-width: 0; }
.edit-actions { display: flex; gap: 0.6rem; }
.edit-actions .btn { flex: 1; }
.btn.hide-btn { color: #d0645c; border-color: #6a2f2c; }
#edit-msg { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.05em; color: var(--text-dim); min-height: 1.2em; }
#edit-msg.err { color: #d0645c; }

#manage-panel { border: 0.5px solid var(--border); background: var(--bg-card); padding: 0.9rem; margin-bottom: 0.8rem; }
#manage-panel > * + * { margin-top: 0.7rem; }
.manage-title { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.15em; color: var(--gold-dim); text-transform: uppercase; }
.manage-list { display: flex; flex-direction: column; gap: 0.4rem; max-height: 40vh; overflow-y: auto; }
.manage-row { display: flex; align-items: center; gap: 0.6rem; font-size: 15px; }
.manage-row input { accent-color: var(--gold); width: 18px; height: 18px; }
.manage-row.is-hidden { color: var(--text-dim); }
#add-item-panel { border-top: 0.5px solid var(--border); padding-top: 0.7rem; }
#add-item-panel > * + * { margin-top: 0.6rem; }
#add-item-panel input, #add-item-panel select {
  width: 100%; background: var(--bg); border: 0.5px solid var(--border); color: var(--text);
  font-family: 'IBM Plex Mono', monospace; font-size: 16px; padding: 9px 10px; color-scheme: dark;
}
#add-item-msg { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.05em; color: var(--text-dim); min-height: 1.2em; }
#add-item-msg.err { color: #d0645c; }
#add-item-msg.ok { color: var(--teal); }

.card.done { opacity: 0.55; }
.c-done { color: var(--teal); margin-right: 0.4rem; }
.c-tally.overdue { color: #d0645c; }
.c-due-when { color: var(--text-dim); }
#reassess, #due { border: 0.5px solid var(--gold-dim); background: var(--bg-card); padding: 0.7rem 0.9rem; margin-bottom: 0.9rem; }
#reassess .manage-title, #due .manage-title { margin-bottom: 0.35rem; }
#reassess { border-color: var(--teal); cursor: pointer; }
#reassess .manage-title { color: var(--teal); }
#reassess-list, #due-list { font-size: 15px; color: var(--text); line-height: 1.6; }
.e-label { display: block; font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.1em; color: var(--text-dim); margin-bottom: 3px; }
.e-countdown { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.05em; color: var(--text-dim); }
.card.light-bg .e-label, .card.light-bg .e-countdown { color: #3a3a46; }

#goals > * + * { margin-top: 0.5rem; }
.g-row { border: 0.5px solid var(--border); background: var(--bg-card); padding: 0.75rem 0.9rem; cursor: pointer; }
.g-top { display: flex; align-items: baseline; gap: 0.6rem; }
.g-name { flex: 1; min-width: 0; font-size: 16px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.g-target, .g-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.04em; color: var(--text-dim); white-space: nowrap; }
.g-count.ready { color: var(--teal); }
.g-bar { height: 4px; background: var(--bg); margin-top: 0.5rem; }
.g-fill { height: 100%; background: var(--gold-dim); }
.g-fill.ready { background: var(--teal); }
.g-edit { margin-top: 0.7rem; cursor: default; }
.g-edit > * + * { margin-top: 0.5rem; }
.g-edit input, .g-edit select { width: 100%; background: var(--bg); border: 0.5px solid var(--border); color: var(--text); font-family: 'IBM Plex Mono', monospace; font-size: 15px; padding: 8px 9px; color-scheme: dark; }
.g-msg { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #d0645c; min-height: 1.2em; }
#goals-none { margin-top: 1.2rem; }
#goals-none-list { font-size: 15px; color: var(--text-dim); line-height: 1.9; }
.g-none-name { cursor: pointer; }
.g-none-name:hover, .g-none-name.sel { color: var(--gold); }
#empty, #loading { padding: 1.5rem; color: var(--text-dim); font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.06em; line-height: 1.7; }
[hidden] { display: none !important; }

#login { max-width: 420px; margin: 2rem auto; }
#login p { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-dim); letter-spacing: 0.05em; margin-bottom: 1rem; line-height: 1.7; }
#login input { width: 100%; background: var(--bg-card); border: 0.5px solid var(--border); color: var(--text); font-family: 'IBM Plex Mono', monospace; font-size: 13px; padding: 10px 12px; margin-bottom: 1rem; }
#login-msg { min-height: 1.5em; margin-top: 1rem; margin-bottom: 0; }
#login-msg.err { color: #d0645c; }
#login-msg.ok { color: var(--teal); }
</style>
</head>
<body>

<script src="nav.js"></script>
<script src="auth.js"></script>

<div class="page-wrap">

  <div class="page-header">
    <h1>Clicker</h1>
    <p class="byline">tap to log — private, needs login</p>
  </div>

  <div id="login" hidden>
    <p>this list is private. enter your email and a sign-in link will be sent to it.</p>
    <input type="email" id="login-email" placeholder="email" autocomplete="email">
    <button class="btn" id="login-btn">send link</button>
    <p id="login-msg"></p>
  </div>

  <div id="wrap" hidden>
    <div id="bar">
      <button class="btn" id="edit-toggle">edit</button>
      <button class="btn" id="plus-btn" hidden>+</button>
      <button class="btn" id="goals-btn">goals</button>
      <span id="status"></span>
      <button id="signout">sign out</button>
    </div>

    <div id="manage-panel" hidden>
      <div class="manage-title">show / hide</div>
      <div class="manage-list" id="manage-list"></div>
      <button class="btn" id="add-item-toggle">+ add new item</button>
      <div id="add-item-panel" hidden>
        <input type="text" id="f-name" placeholder="item name" maxlength="200" autocomplete="off">
        <div class="field-row">
          <input type="text" id="f-qty" inputmode="decimal" placeholder="quantity per click (default 1)" autocomplete="off">
          <select id="f-qtype" aria-label="quantity type"><option value="">no unit</option></select>
        </div>
        <select id="f-cat" aria-label="category"></select>
        <div class="field-row" id="f-new-qtype-row" hidden>
          <input type="text" id="f-new-qtype" placeholder="new unit, e.g. rep" maxlength="40" autocomplete="off">
          <button class="btn" id="save-qtype">save unit</button>
        </div>
        <div id="add-item-msg"></div>
        <button class="btn" id="add-item-btn">add item</button>
      </div>
    </div>

    <div id="due" hidden>
      <div class="manage-title">maintenance due</div>
      <div id="due-list"></div>
    </div>

    <div id="reassess" hidden>
      <div class="manage-title">ready to reassess — tap for goals</div>
      <div id="reassess-list"></div>
    </div>

    <div id="filters"></div>

    <div id="list"></div>

    <div id="goals" hidden>
      <div id="goals-list"></div>
      <div id="goals-none">
        <div class="manage-title">no goal</div>
        <div id="goals-none-list"></div>
        <div id="goals-none-edit"></div>
      </div>
    </div>
  </div>

</div>

<footer>nocturne &mdash; built slowly, in the dark</footer>

<script>
const UNDO_MS = 5000;
const COLOR_RE = /^#[0-9a-fA-F]{6}$/;
// muted presets that keep the default light text readable on the dark theme
const ITEM_COLS = 'id,name,quantity_per_click,quantity_type_id,hidden,color,category_id,daily_limit,reassess_days,reassess_taps,countdown_since,interval_days,due_date,cycle_months,sort_order';
const DAY_MS = 86400000;
const NOTE_MAX = 500;
const PRESET_COLORS = ['#2a1f3d', '#1f2f4a', '#1d3a3a', '#243a24', '#3d3520', '#45261f', '#3d1f2c', '#2e2e34'];

let items = [];
let qtypes = [];
let categories = [];          // ordered by sort_order; items with no category count as "other"
let filter = 'all';           // a category id (as a string), set to "core" on load; 'all' = fallback only, no button
const todayTotals = {};       // item id -> number logged today
// logs from today, plus every log since the countdown started for items with a reassess gate:
// { id, item_id, logged_at }. Drives the "done for today" check and the countdown.
let gateLogs = [];
// maintenance items (interval_days set): item id -> logged_at of the newest log, or null if never logged
const lastDone = {};
const recent = new Map();     // item id -> { stack: [{ logId, qty }], timer } — every tap within the undo window, newest last
const busy = new Set();       // item ids with a click save in flight
let editMode = false;
const expandedEdit = new Set(); // item ids showing their edit panel (edit mode only)
let managePanelOpen = false;
let addingItemOpen = false;
let goalsView = false;
let goalEditing = null;       // item id whose goal editor is open in the goals view

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

function setStatus(text, kind) {
  const el = document.getElementById('status');
  el.textContent = text;
  el.className = kind || '';
}

function startOfTodayIso() {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  return d.toISOString();
}

/* ---------- daily limit + reassess countdown ---------- */

function localDayKey(d) {
  return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
}

function tapsToday(id) {
  const today = localDayKey(new Date());
  return gateLogs.filter(l => l.item_id === id && localDayKey(new Date(l.logged_at)) === today).length;
}

// reaching the daily limit marks the item done; taps past it still log, they just don't count extra
function isDoneToday(i) {
  return i.daily_limit != null && tapsToday(i.id) >= i.daily_limit;
}

// days since the countdown started on which the full daily dose was reached (any tap, with no limit set)
function fullDays(i) {
  const since = new Date(i.countdown_since).getTime();
  const perDay = {};
  for (const l of gateLogs) {
    if (l.item_id !== i.id || new Date(l.logged_at).getTime() < since) continue;
    const k = localDayKey(new Date(l.logged_at));
    perDay[k] = (perDay[k] || 0) + 1;
  }
  const need = i.daily_limit || 1;
  return Object.values(perDay).filter(n => n >= need).length;
}

// taps logged since the countdown started (every tap counts, daily minimum or not)
function tapsSince(i) {
  const since = new Date(i.countdown_since).getTime();
  return gateLogs.filter(l => l.item_id === i.id && new Date(l.logged_at).getTime() >= since).length;
}

// a goal is either N counted days or N taps; it only triggers a reassessment, never changes anything itself
function hasGoal(i) {
  return i.reassess_days != null || i.reassess_taps != null;
}

function goalProgress(i) {
  if (i.reassess_days != null) return { done: Math.min(fullDays(i), i.reassess_days), target: i.reassess_days, unit: 'days' };
  if (i.reassess_taps != null) return { done: Math.min(tapsSince(i), i.reassess_taps), target: i.reassess_taps, unit: 'taps' };
  return null;
}

function daysLeft(i) {
  const g = goalProgress(i);
  return g ? g.target - g.done : null;
}

function isReadyToReassess(i) {
  return hasGoal(i) && daysLeft(i) === 0;
}

/* ---------- maintenance (repeat every N days) ---------- */

// two kinds: rolling (interval_days: next = last done + N days) and fixed deadline
// (due_date + cycle_months, e.g. car registration; logging moves the date forward server-side)
function isMaintenance(i) {
  return i.interval_days != null || i.due_date != null;
}

function isFixed(i) {
  return i.due_date != null;
}

// a fixed deadline shows up in the due box this many days ahead, so it can still be met
function leadDays(i) {
  return i.cycle_months >= 3 ? 30 : 7;
}

function parseLocalDate(ymd) {
  const [y, m, d] = ymd.split('-').map(Number);
  return new Date(y, m - 1, d).getTime();
}

function startOfLocalDay(d) {
  const x = new Date(d);
  x.setHours(0, 0, 0, 0);
  return x.getTime();
}

// whole calendar days until the next one is due (0 = due today, negative = overdue); null if never logged
function maintDaysLeft(i) {
  if (isFixed(i)) return Math.round((parseLocalDate(i.due_date) - startOfLocalDay(new Date())) / DAY_MS);
  const last = lastDone[i.id];
  if (!last) return null;
  const since = Math.round((startOfLocalDay(new Date()) - startOfLocalDay(new Date(last))) / DAY_MS);
  return i.interval_days - since;
}

function isDue(i) {
  const left = maintDaysLeft(i);
  if (isFixed(i)) return left <= leadDays(i);
  return left === null || left <= 0;
}

function isLate(i) {
  const left = maintDaysLeft(i);
  return left === null || left <= 0;
}

async function refreshItem(id) {
  const rows = await NAuth.rest('clicker', 'items?id=eq.' + encodeURIComponent(id) + '&select=' + ITEM_COLS);
  const item = items.find(i => i.id === id);
  if (item && Array.isArray(rows) && rows.length === 1) Object.assign(item, rows[0]);
}

function dueText(i) {
  const left = maintDaysLeft(i);
  if (left === null) return 'never logged';
  if (left === 0) return 'due today';
  if (left < 0) return `overdue ${-left} d`;
  return `due in ${left} d`;
}

function shortDate(iso) {
  const d = new Date(iso);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

async function loadLastDone(ids) {
  if (!ids.length) return;
  const rows = await NAuth.rest('clicker', 'logs?select=item_id,logged_at&order=logged_at.desc&item_id=in.(' + ids.join(',') + ')');
  for (const id of ids) lastDone[id] = null;
  for (const r of rows) if (!lastDone[r.item_id]) lastDone[r.item_id] = r.logged_at;
}

function qtypeName(id) {
  const t = qtypes.find(q => q.id === id);
  return t ? t.name : '';
}

function otherCategoryId() {
  const c = categories.find(c => c.name === 'other');
  return c ? c.id : null;
}

// uncategorized items belong to "other", so nothing can fall outside every filter
function effectiveCategory(i) {
  return i.category_id != null ? i.category_id : otherCategoryId();
}

function matchesFilter(i) {
  return filter === 'all' || String(effectiveCategory(i)) === filter;
}

function categoryOptions(selectedId) {
  return categories.map(c =>
    `<option value="${c.id}"${c.id === selectedId ? ' selected' : ''}>${escapeHtml(c.name)}</option>`).join('');
}

/* ---------- card colors ---------- */

function isLightColor(hex) {
  const n = parseInt(hex.slice(1), 16);
  const [r, g, b] = [n >> 16, (n >> 8) & 255, n & 255];
  return (0.299 * r + 0.587 * g + 0.114 * b) / 255 > 0.55;
}

// class + style attributes for a card; color is re-validated here because it lands in markup
function colorAttrs(color) {
  if (!color || !COLOR_RE.test(color)) return { cls: '', style: '' };
  return { cls: ' colored' + (isLightColor(color) ? ' light-bg' : ''), style: ` style="background:${color}"` };
}

// preview a color on an open edit row without re-rendering (which would drop unsaved form input)
function applyRowColor(row, color) {
  row.dataset.color = color || '';
  row.style.background = color || '';
  row.classList.toggle('colored', !!color);
  row.classList.toggle('light-bg', !!color && isLightColor(color));
  for (const s of row.querySelectorAll('.swatch')) s.classList.toggle('sel', (s.dataset.color || '') === (color || ''));
  if (color) row.querySelector('.e-color-custom').value = color;
}

function swatchesHtml(current) {
  const cur = current || '';
  let html = `<button class="swatch none${cur ? '' : ' sel'}" data-act="color" data-color="" title="no color" aria-label="no color"></button>`;
  for (const c of PRESET_COLORS) {
    html += `<button class="swatch${c === cur ? ' sel' : ''}" data-act="color" data-color="${c}" style="background:${c}" aria-label="color ${c}"></button>`;
  }
  html += `<input type="color" class="e-color-custom" value="${cur || '#2a1f3d'}" title="custom color" aria-label="custom color">`;
  return `<div class="swatches">${html}</div>`;
}

/* ---------- rendering ---------- */

function render() {
  renderBar();
  for (const id of ['due', 'reassess', 'filters', 'list']) document.getElementById(id).hidden = goalsView;
  document.getElementById('goals').hidden = !goalsView;
  if (goalsView) { renderGoals(); return; }
  renderDue();
  renderReassess();
  renderFilters();
  renderList();
  renderManagePanel();
}

function renderBar() {
  const editBtn = document.getElementById('edit-toggle');
  editBtn.textContent = editMode ? 'done' : 'edit';
  editBtn.className = 'btn' + (editMode ? ' on' : '');
  document.getElementById('plus-btn').hidden = !editMode;
  editBtn.hidden = goalsView;
  const goalsBtn = document.getElementById('goals-btn');
  goalsBtn.textContent = goalsView ? '← clicker' : 'goals';
  goalsBtn.hidden = editMode;
  if (!editMode) {
    managePanelOpen = false;
    document.getElementById('manage-panel').hidden = true;
  }
}

// shown regardless of the category filter; an entry clears once the quantity per click changes
// or the countdown is restarted in edit mode
function renderReassess() {
  const ready = items.filter(i => !i.hidden && isReadyToReassess(i));
  document.getElementById('reassess').hidden = !ready.length;
  document.getElementById('reassess-list').innerHTML = ready.map(i => escapeHtml(i.name)).join('<br>');
}

// shown regardless of the category filter, so a due item surfaces wherever you are
function renderDue() {
  const due = items.filter(i => !i.hidden && isMaintenance(i) && isDue(i));
  document.getElementById('due').hidden = !due.length;
  document.getElementById('due-list').innerHTML = due.map(i =>
    `${escapeHtml(i.name)} <span class="c-due-when">— ${dueText(i)}</span>`).join('<br>');
}

/* ---------- goals view ---------- */

function goalEditorHtml(i) {
  const unit = i.reassess_taps != null ? 'taps' : 'days';
  const n = i.reassess_days != null ? i.reassess_days : (i.reassess_taps != null ? i.reassess_taps : '');
  return `
      <div class="g-edit" data-id="${i.id}">
        <div class="field-row">
          <input type="text" class="g-n" inputmode="numeric" placeholder="number" value="${n}">
          <select class="g-unit" aria-label="goal type">
            <option value="days"${unit === 'days' ? ' selected' : ''}>days</option>
            <option value="taps"${unit === 'taps' ? ' selected' : ''}>taps</option>
          </select>
        </div>
        <div class="edit-actions">
          <button class="btn" data-act="g-save">${hasGoal(i) ? 'save & restart' : 'set goal'}</button>
          ${hasGoal(i) ? '<button class="btn hide-btn" data-act="g-clear">clear goal</button>' : ''}
          <button class="btn" data-act="g-cancel">cancel</button>
        </div>
        <div class="g-msg"></div>
      </div>`;
}

// items with a goal, closest to done first; everything else in one line underneath
function renderGoals() {
  const pool = items.filter(i => !i.hidden && !isMaintenance(i));
  const withGoal = pool.filter(hasGoal).map(i => ({ i, g: goalProgress(i) }))
    .sort((a, b) => b.g.done / b.g.target - a.g.done / a.g.target);
  document.getElementById('goals-list').innerHTML = withGoal.map(({ i, g }) => {
    const ready = g.done >= g.target;
    const pct = Math.round(100 * g.done / g.target);
    return `
    <div class="g-row" data-id="${i.id}">
      <div class="g-top">
        <span class="g-name">${escapeHtml(i.name)}</span>
        <span class="g-target">${g.target} ${g.unit}</span>
        <span class="g-count${ready ? ' ready' : ''}">${ready ? 'ready' : g.done + '/' + g.target}</span>
      </div>
      <div class="g-bar"><div class="g-fill${ready ? ' ready' : ''}" style="width:${pct}%"></div></div>
      ${goalEditing === i.id ? goalEditorHtml(i) : ''}
    </div>`;
  }).join('') || '<div id="empty">no goals set yet.</div>';
  const none = pool.filter(i => !hasGoal(i));
  document.getElementById('goals-none').hidden = !none.length;
  document.getElementById('goals-none-list').innerHTML = none.map(i =>
    `<span class="g-none-name${goalEditing === i.id ? ' sel' : ''}" data-id="${i.id}">${escapeHtml(i.name)}</span>`).join(' · ');
  const editingNone = none.find(i => i.id === goalEditing);
  document.getElementById('goals-none-edit').innerHTML = editingNone ? goalEditorHtml(editingNone) : '';
}

// setting or changing a goal always restarts its count from now (the server stamps the time)
async function saveGoal(id, box, clear) {
  const item = items.find(i => i.id === id);
  if (!item || busy.has(id)) return;
  const msg = t => { box.querySelector('.g-msg').textContent = t; };
  let body;
  if (clear) body = { reassess_days: null, reassess_taps: null };
  else {
    const raw = box.querySelector('.g-n').value.trim();
    if (!/^[1-9]\d{0,2}$/.test(raw)) { msg('a whole number 1–999'); return; }
    const taps = box.querySelector('.g-unit').value === 'taps';
    body = { reassess_days: taps ? null : Number(raw), reassess_taps: taps ? Number(raw) : null, countdown_since: new Date().toISOString() };
  }
  busy.add(id);
  try {
    const rows = await NAuth.rest('clicker', 'items?id=eq.' + encodeURIComponent(id) + '&select=' + ITEM_COLS,
      { method: 'PATCH', body, prefer: 'return=representation' });
    if (!Array.isArray(rows) || rows.length !== 1) throw new Error('not saved (no permission?)');
    Object.assign(item, rows[0]);
    goalEditing = null;
    setStatus('✓ ' + (clear ? 'goal cleared: ' : 'goal set: ') + item.name, 'ok');
  } catch (e) {
    busy.delete(id);
    if (e.code === 'auth') { showLogin('session expired — request a new link.', 'err'); return; }
    msg('could not save: ' + e.message);
    return;
  }
  busy.delete(id);
  render();
}

function renderFilters() {
  // rows of 3 in sort_order: daily practices on the first line, occasional stuff on the second
  const btns = categories.map(c => {
    const key = String(c.id);
    return `<button class="btn${key === filter ? ' on' : ''}" data-filter="${key}">${escapeHtml(c.name)}</button>`;
  });
  const rows = [];
  for (let k = 0; k < btns.length; k += 3) rows.push(`<div class="f-row">${btns.slice(k, k + 3).join('')}</div>`);
  document.getElementById('filters').innerHTML = rows.join('');
}

function cardHtml(i) {
  const isExp = expandedEdit.has(i.id);
  const total = todayTotals[i.id] || 0;
  const unit = i.quantity_type_id ? ' ' + escapeHtml(qtypeName(i.quantity_type_id)) : '';
  const rec = recent.get(i.id);
  const undo = rec ? `<button class="c-undo" data-act="undo">undo${rec.stack.length > 1 ? ' ×' + rec.stack.length : ''}</button>` : '';
  const col = colorAttrs(i.color);

  if (!editMode && isMaintenance(i)) {
    const due = isDue(i);
    const last = lastDone[i.id];
    return `
    <div class="card${col.cls}${due ? '' : ' done'}${busy.has(i.id) ? ' busy' : ''}" data-id="${i.id}" data-act="log"${col.style}>
      <div class="card-top">
        <span class="c-name">${escapeHtml(i.name)}</span>
        <span class="c-tally${isLate(i) ? ' overdue' : ''}">${due ? '' : '<span class="c-done">✓</span>'}${dueText(i)}${undo}</span>
      </div>
      <div class="c-sub">${last ? 'last ' + shortDate(last) + ' · ' : ''}${isFixed(i)
        ? `deadline ${escapeHtml(i.due_date)} · every ${i.cycle_months} mo`
        : `every ${i.interval_days} d`}</div>
    </div>`;
  }

  if (!editMode) {
    // what one tap is worth; skipped for a plain unitless 1, where it would only add noise
    const qty = Number(i.quantity_per_click);
    const per = (qty !== 1 || unit) ? `<span class="c-per">+${qty}${unit}</span>` : '';
    const done = isDoneToday(i);
    return `
    <div class="card${col.cls}${done ? ' done' : ''}${busy.has(i.id) ? ' busy' : ''}" data-id="${i.id}" data-act="log"${col.style}>
      <div class="card-top">
        <span class="c-name">${escapeHtml(i.name)}${per}</span>
        <span class="c-tally">${done ? '<span class="c-done">✓</span>' : ''}${total}${unit} today${undo}</span>
      </div>
    </div>`;
  }

  const perClick = Number(i.quantity_per_click);
  const sub = `${perClick}${unit ? unit : ''} / click`;
  const panel = isExp ? `
      <div class="edit-panel" data-act="stop">
        <input type="text" class="e-name" placeholder="item name" value="${escapeHtml(i.name)}">
        <div class="field-row">
          <input type="text" class="e-qty" inputmode="decimal" placeholder="quantity per click" value="${escapeHtml(String(perClick))}">
          <select class="e-qtype">${qtypeOptions(i.quantity_type_id)}</select>
        </div>
        <select class="e-cat" aria-label="category">${categoryOptions(effectiveCategory(i))}</select>
        <div class="field-row e-new-qtype-row" hidden>
          <input type="text" class="e-new-qtype" placeholder="new unit, e.g. rep" maxlength="40">
          <button class="btn" data-act="save-qtype">save unit</button>
        </div>
        <label><span class="e-label">daily minimum</span>
          <input type="text" class="e-limit" inputmode="numeric" placeholder="none" value="${i.daily_limit != null ? i.daily_limit : ''}"></label>
        <label><span class="e-label">maintenance, rolling: repeat every (days) after last done</span>
          <input type="text" class="e-interval" inputmode="numeric" placeholder="none" value="${i.interval_days != null ? i.interval_days : ''}"></label>
        <div class="field-row">
          <label><span class="e-label">or fixed: next deadline</span>
            <input type="date" class="e-due" value="${i.due_date ? escapeHtml(i.due_date) : ''}"></label>
          <label><span class="e-label">every (months)</span>
            <input type="text" class="e-cycle" inputmode="numeric" placeholder="none" value="${i.cycle_months != null ? i.cycle_months : ''}"></label>
        </div>
        <div class="e-countdown">${countdownText(i)}</div>
        ${swatchesHtml(i.color)}
        <div class="edit-actions">
          <button class="btn" data-act="save">save</button>
          <button class="btn" data-act="move" data-dir="-1" aria-label="move up">▲</button>
          <button class="btn" data-act="move" data-dir="1" aria-label="move down">▼</button>
          <button class="btn hide-btn" data-act="hide">hide</button>
        </div>
        <div class="edit-msg"></div>
      </div>` : '';
  return `
    <div class="card edit-mode${col.cls}${busy.has(i.id) ? ' busy' : ''}" data-id="${i.id}" data-act="edit-toggle-row" data-color="${i.color && COLOR_RE.test(i.color) ? i.color : ''}"${col.style}>
      <div class="card-top">
        <span class="c-name">${escapeHtml(i.name)}</span>
        <span class="c-tally">${sub}</span>
      </div>
      ${panel}
    </div>`;
}

function countdownText(i) {
  const g = goalProgress(i);
  if (!g) return 'no goal (set one in "goals")';
  return g.done >= g.target ? 'goal: ready to reassess' : `goal: ${g.done}/${g.target} ${g.unit}`;
}

function qtypeOptions(selectedId) {
  let html = `<option value=""${!selectedId ? ' selected' : ''}>no unit</option>`;
  for (const t of qtypes) {
    html += `<option value="${t.id}"${t.id === selectedId ? ' selected' : ''}>${escapeHtml(t.name)}</option>`;
  }
  html += `<option value="__new">+ new unit…</option>`;
  return html;
}

// how neglected a rolling item is: days since last done / interval (1 = due today); never logged = most
function neglect(i) {
  if (i.interval_days == null) return -Infinity;
  const last = lastDone[i.id];
  if (!last) return Infinity;
  const since = Math.round((startOfLocalDay(new Date()) - startOfLocalDay(new Date(last))) / DAY_MS);
  return since / i.interval_days;
}

// connections view (not in edit mode, so ▲/▼ still shows the manual order): most neglected on top
function isConnectionsView() {
  const cat = categories.find(c => c.name === 'connections');
  return !editMode && cat != null && String(cat.id) === filter;
}

function renderList() {
  const listEl = document.getElementById('list');
  const visible = items.filter(i => !i.hidden && matchesFilter(i));
  if (isConnectionsView()) {
    visible.sort((a, b) => {
      const na = neglect(a), nb = neglect(b);
      return na === nb ? 0 : (nb > na ? 1 : -1);
    });
  }
  if (!visible.length) {
    const cat = categories.find(c => String(c.id) === filter);
    listEl.innerHTML = cat
      ? `<div id="empty">nothing in "${escapeHtml(cat.name)}" yet.</div>`
      : `<div id="empty">nothing here yet. tap "edit" then "+" to add an item.</div>`;
    return;
  }
  listEl.innerHTML = visible.map(cardHtml).join('');
}

function renderManagePanel() {
  const panel = document.getElementById('manage-panel');
  panel.hidden = !managePanelOpen;
  if (!managePanelOpen) return;
  const listEl = document.getElementById('manage-list');
  listEl.innerHTML = items.map(i => `
    <label class="manage-row${i.hidden ? ' is-hidden' : ''}">
      <input type="checkbox" data-id="${i.id}" data-act="toggle-hidden"${i.hidden ? '' : ' checked'}>
      ${escapeHtml(i.name)}
    </label>`).join('') || '<span style="color:var(--text-dim);font-size:13px">no items yet</span>';
  document.getElementById('add-item-panel').hidden = !addingItemOpen;
  const sel = document.getElementById('f-qtype');
  const prevVal = sel.value;
  fillQtypeSelect(sel);
  if ([...sel.options].some(o => o.value === prevVal)) sel.value = prevVal;
  const catSel = document.getElementById('f-cat');
  const prevCat = catSel.value;
  catSel.innerHTML = categoryOptions(null);
  // keep what the user picked; otherwise default to the category being viewed, else "other"
  catSel.value = prevCat && categories.some(c => String(c.id) === prevCat) ? prevCat
    : (filter !== 'all' ? filter : String(otherCategoryId()));
}

function fillQtypeSelect(sel) {
  const keep = sel.options[0];
  sel.innerHTML = '';
  sel.appendChild(keep);
  for (const t of qtypes) {
    const o = document.createElement('option');
    o.value = t.id; o.textContent = t.name; sel.appendChild(o);
  }
  const opt = document.createElement('option');
  opt.value = '__new'; opt.textContent = '+ new unit…';
  sel.appendChild(opt);
}

/* ---------- logging a click ---------- */

async function logClick(id) {
  const item = items.find(i => i.id === id);
  if (!item || busy.has(id)) return;
  let note = null;
  if (isMaintenance(item)) {
    // rare, record-worthy events: confirm the tap and offer a note (cancel = nothing logged)
    const answer = window.prompt('log "' + item.name + '"?\noptional note (e.g. mileage, cost, who did it):', '');
    if (answer === null) return;
    note = answer.trim().slice(0, NOTE_MAX) || null;
  }
  const qty = Number(item.quantity_per_click);
  todayTotals[id] = (todayTotals[id] || 0) + qty;
  busy.add(id);
  render();
  try {
    const rows = await NAuth.rest('clicker', 'logs?select=id,logged_at',
      { method: 'POST', body: Object.assign({ item_id: id, quantity: qty, quantity_type_id: item.quantity_type_id }, note ? { note } : {}), prefer: 'return=representation' });
    if (!Array.isArray(rows) || rows.length !== 1) throw new Error('not saved (no permission?)');
    const rec = recent.get(id) || { stack: [] };
    rec.stack.push({ logId: rows[0].id, qty, prevLast: lastDone[id] });
    if (isMaintenance(item)) lastDone[id] = rows[0].logged_at;
    if (isFixed(item)) await refreshItem(id);
    gateLogs.push({ id: rows[0].id, item_id: id, logged_at: rows[0].logged_at });
    armUndoTimer(id, rec);
    setStatus('✓ logged: ' + item.name, 'ok');
  } catch (e) {
    todayTotals[id] -= qty;
    if (e.code === 'auth') { showLogin('session expired — request a new link.', 'err'); }
    else setStatus('could not log "' + item.name + '": ' + e.message, 'err');
  }
  busy.delete(id);
  render();
}

// (re)start the undo window; each tap or undo gives a fresh UNDO_MS
function armUndoTimer(id, rec) {
  clearTimeout(rec.timer);
  rec.timer = setTimeout(() => { recent.delete(id); render(); }, UNDO_MS);
  recent.set(id, rec);
}

async function undoClick(id) {
  const rec = recent.get(id);
  if (!rec || busy.has(id)) return;
  clearTimeout(rec.timer);
  const last = rec.stack[rec.stack.length - 1];
  busy.add(id);
  render();
  try {
    await NAuth.rest('clicker', 'logs?id=eq.' + encodeURIComponent(last.logId), { method: 'DELETE' });
    todayTotals[id] = Math.max(0, (todayTotals[id] || 0) - last.qty);
    gateLogs = gateLogs.filter(l => l.id !== last.logId);
    if (id in lastDone) lastDone[id] = last.prevLast === undefined ? null : last.prevLast;
    const undoneItem = items.find(i => i.id === id);
    if (undoneItem && isFixed(undoneItem)) await refreshItem(id);
    rec.stack.pop();
    if (rec.stack.length) armUndoTimer(id, rec); else recent.delete(id);
    setStatus('✓ undone', 'ok');
  } catch (e) {
    if (recent.has(id)) armUndoTimer(id, rec);
    if (e.code === 'auth') { showLogin('session expired — request a new link.', 'err'); }
    else setStatus('could not undo: ' + e.message, 'err');
  }
  busy.delete(id);
  render();
}

/* ---------- editing an item ---------- */

function setEditMsg(row, text, kind) {
  const el = row.querySelector('.edit-msg');
  if (el) { el.textContent = text; el.className = 'edit-msg' + (kind ? ' ' + kind : ''); }
}

async function saveItem(id, row) {
  const item = items.find(i => i.id === id);
  if (!item || busy.has(id)) return;
  const name = row.querySelector('.e-name').value.trim();
  const qtyRaw = row.querySelector('.e-qty').value.trim();
  const qtypeSel = row.querySelector('.e-qtype').value;
  const color = row.dataset.color || null;
  const catSel = row.querySelector('.e-cat').value;
  if (!name) { setEditMsg(row, 'name is required', 'err'); return; }
  if (color && !COLOR_RE.test(color)) { setEditMsg(row, 'invalid color', 'err'); return; }
  if (qtypeSel === '__new') { setEditMsg(row, 'save or clear the new unit first', 'err'); return; }
  if (qtyRaw && !/^\d{1,6}(\.\d+)?$/.test(qtyRaw)) { setEditMsg(row, 'quantity must be a number', 'err'); return; }
  const limitRaw = row.querySelector('.e-limit').value.trim();
  if (limitRaw && !/^[1-9]\d{0,2}$/.test(limitRaw)) { setEditMsg(row, 'daily minimum must be a whole number 1–999', 'err'); return; }
  const intervalRaw = row.querySelector('.e-interval').value.trim();
  if (intervalRaw && !(/^[1-9]\d{0,3}$/.test(intervalRaw) && Number(intervalRaw) <= 3650)) { setEditMsg(row, 'repeat days must be a whole number 1–3650', 'err'); return; }
  const dueRaw = row.querySelector('.e-due').value.trim();
  const cycleRaw = row.querySelector('.e-cycle').value.trim();
  if (dueRaw && !/^\d{4}-\d{2}-\d{2}$/.test(dueRaw)) { setEditMsg(row, 'invalid deadline date', 'err'); return; }
  if (cycleRaw && !(/^[1-9]\d{0,2}$/.test(cycleRaw) && Number(cycleRaw) <= 120)) { setEditMsg(row, 'months must be a whole number 1–120', 'err'); return; }
  if (!dueRaw !== !cycleRaw) { setEditMsg(row, 'a fixed deadline needs both the date and the months', 'err'); return; }
  if (dueRaw && intervalRaw) { setEditMsg(row, 'pick rolling days or a fixed deadline, not both', 'err'); return; }
  const body = {
    name,
    quantity_per_click: qtyRaw ? Number(qtyRaw) : 1,
    quantity_type_id: qtypeSel ? Number(qtypeSel) : null,
    color,
    category_id: catSel ? Number(catSel) : null,
    daily_limit: limitRaw ? Number(limitRaw) : null,
    interval_days: intervalRaw ? Number(intervalRaw) : null,
    due_date: dueRaw || null,
    cycle_months: cycleRaw ? Number(cycleRaw) : null,
  };
  busy.add(id);
  render();
  try {
    const rows = await NAuth.rest('clicker', 'items?id=eq.' + encodeURIComponent(id) + '&select=' + ITEM_COLS,
      { method: 'PATCH', body, prefer: 'return=representation' });
    if (!Array.isArray(rows) || rows.length !== 1) throw new Error('not saved (no permission?)');
    Object.assign(item, rows[0]);
    if (isMaintenance(item) && !(id in lastDone)) await loadLastDone([id]);
    expandedEdit.delete(id);
    setStatus('✓ saved: ' + name, 'ok');
  } catch (e) {
    if (e.code === 'auth') { showLogin('session expired — request a new link.', 'err'); return; }
    setStatus('could not save: ' + e.message, 'err');
  }
  busy.delete(id);
  render();
}

// swap with the neighbour in the current view, then renumber every item 1..n so the
// order is fully explicit; only rows whose number changed get written
async function moveItem(id, dir) {
  const visible = items.filter(i => !i.hidden && matchesFilter(i));
  const pos = visible.findIndex(i => i.id === id);
  const other = visible[pos + dir];
  if (pos < 0 || !other || busy.size) return;
  const order = items.slice();
  const a = order.findIndex(i => i.id === id), b = order.findIndex(i => i.id === other.id);
  [order[a], order[b]] = [order[b], order[a]];
  const changed = order.map((i, n) => ({ item: i, n: n + 1 })).filter(x => x.item.sort_order !== x.n);
  const prev = items;
  items = order;
  for (const x of changed) busy.add(x.item.id);
  render();
  try {
    await Promise.all(changed.map(async x => {
      const rows = await NAuth.rest('clicker', 'items?id=eq.' + encodeURIComponent(x.item.id),
        { method: 'PATCH', body: { sort_order: x.n }, prefer: 'return=representation' });
      if (!Array.isArray(rows) || rows.length !== 1) throw new Error('not saved (no permission?)');
      x.item.sort_order = x.n;
    }));
  } catch (e) {
    items = prev; // original order; anything already written shows up on the next reload
    if (e.code === 'auth') { showLogin('session expired — request a new link.', 'err'); }
    else setStatus('could not reorder: ' + e.message, 'err');
  }
  for (const x of changed) busy.delete(x.item.id);
  render();
}

async function hideItem(id) {
  const item = items.find(i => i.id === id);
  if (!item || busy.has(id)) return;
  busy.add(id);
  render();
  try {
    const rows = await NAuth.rest('clicker', 'items?id=eq.' + encodeURIComponent(id),
      { method: 'PATCH', body: { hidden: true }, prefer: 'return=representation' });
    if (!Array.isArray(rows) || rows.length !== 1) throw new Error('not saved (no permission?)');
    item.hidden = true;
    expandedEdit.delete(id);
    setStatus('✓ hidden: ' + item.name, 'ok');
  } catch (e) {
    if (e.code === 'auth') { showLogin('session expired — request a new link.', 'err'); }
    else setStatus('could not hide: ' + e.message, 'err');
  }
  busy.delete(id);
  render();
}

async function setHidden(id, hidden) {
  const item = items.find(i => i.id === id);
  if (!item) return;
  const prev = item.hidden;
  item.hidden = hidden;
  render();
  try {
    const rows = await NAuth.rest('clicker', 'items?id=eq.' + encodeURIComponent(id),
      { method: 'PATCH', body: { hidden }, prefer: 'return=representation' });
    if (!Array.isArray(rows) || rows.length !== 1) throw new Error('not saved (no permission?)');
  } catch (e) {
    item.hidden = prev;
    if (e.code === 'auth') { showLogin('session expired — request a new link.', 'err'); }
    else setStatus('could not update: ' + e.message, 'err');
    render();
  }
}

/* ---------- adding a quantity type inline (shared by add-item panel and per-row edit) ---------- */

async function saveQtype(name) {
  name = name.trim();
  if (!name) return null;
  const existing = qtypes.find(t => t.name.toLowerCase() === name.toLowerCase());
  if (existing) return existing;
  const rows = await NAuth.rest('clicker', 'quantity_types?select=id,name',
    { method: 'POST', body: { name }, prefer: 'return=representation' });
  if (!Array.isArray(rows) || rows.length !== 1) throw new Error('not saved (no permission?)');
  qtypes.push(rows[0]);
  qtypes.sort((a, b) => a.name.localeCompare(b.name));
  return rows[0];
}

/* ---------- adding a new item ---------- */

async function addItem() {
  const name = document.getElementById('f-name').value.trim();
  const qtyRaw = document.getElementById('f-qty').value.trim();
  const qtypeSel = document.getElementById('f-qtype').value;
  const catSel = document.getElementById('f-cat').value;
  const msgEl = document.getElementById('add-item-msg');
  const setMsg = (t, k) => { msgEl.textContent = t; msgEl.className = k || ''; };

  if (!name) { setMsg('name is required', 'err'); return; }
  if (qtypeSel === '__new') { setMsg('save or clear the new unit first', 'err'); return; }
  if (qtyRaw && !/^\d{1,6}(\.\d+)?$/.test(qtyRaw)) { setMsg('quantity must be a number', 'err'); return; }

  const body = {
    name,
    quantity_per_click: qtyRaw ? Number(qtyRaw) : 1,
    quantity_type_id: qtypeSel ? Number(qtypeSel) : null,
    category_id: catSel ? Number(catSel) : null,
  };
  setMsg('adding…');
  try {
    const rows = await NAuth.rest('clicker', 'items?select=' + ITEM_COLS,
      { method: 'POST', body, prefer: 'return=representation' });
    if (!Array.isArray(rows) || rows.length !== 1) throw new Error('not saved (no permission?)');
    items.push(rows[0]);
    document.getElementById('f-name').value = '';
    document.getElementById('f-qty').value = '';
    document.getElementById('f-qtype').value = '';
    document.getElementById('f-cat').value = '';
    document.getElementById('f-new-qtype-row').hidden = true;
    setMsg('✓ added: ' + name, 'ok');
    addingItemOpen = false;
    render();
  } catch (e) {
    if (e.code === 'auth') { showLogin('session expired — request a new link.', 'err'); return; }
    setMsg('could not add: ' + e.message, 'err');
  }
}

/* ---------- login ---------- */

function showLogin(msg, kind) {
  document.getElementById('wrap').hidden = true;
  document.getElementById('login').hidden = false;
  setLoginMsg(msg || '', kind);
}
function setLoginMsg(msg, kind) {
  const el = document.getElementById('login-msg');
  el.textContent = msg;
  el.className = kind || '';
}
async function sendLink() {
  const email = document.getElementById('login-email').value.trim();
  if (!email) return;
  const btn = document.getElementById('login-btn');
  btn.disabled = true;
  setLoginMsg('sending…');
  try {
    await NAuth.sendLink(email);
    setLoginMsg('link sent — open it on this device.', 'ok');
  } catch (e) {
    setLoginMsg('could not send link: ' + e.message, 'err');
  }
  btn.disabled = false;
}

/* ---------- events ---------- */

document.getElementById('edit-toggle').addEventListener('click', () => {
  editMode = !editMode;
  expandedEdit.clear();
  render();
});

document.getElementById('plus-btn').addEventListener('click', () => {
  managePanelOpen = !managePanelOpen;
  addingItemOpen = false;
  render();
});

document.getElementById('goals-btn').addEventListener('click', () => {
  goalsView = !goalsView;
  goalEditing = null;
  render();
});

// the "ready to reassess" box is a shortcut into the goals view
document.getElementById('reassess').addEventListener('click', () => {
  goalsView = true;
  goalEditing = null;
  render();
});

document.getElementById('goals').addEventListener('click', e => {
  const act = e.target.dataset.act;
  const box = e.target.closest('.g-edit');
  if (box) {
    const id = Number(box.dataset.id);
    if (act === 'g-save') saveGoal(id, box, false);
    else if (act === 'g-clear') saveGoal(id, box, true);
    else if (act === 'g-cancel') { goalEditing = null; render(); }
    return; // clicks inside the editor don't toggle it
  }
  const target = e.target.closest('.g-row, .g-none-name');
  if (!target) return;
  const id = Number(target.dataset.id);
  goalEditing = goalEditing === id ? null : id;
  render();
});

document.getElementById('add-item-toggle').addEventListener('click', () => {
  addingItemOpen = !addingItemOpen;
  if (addingItemOpen) { document.getElementById('f-cat').value = ''; renderManagePanel(); }
  document.getElementById('add-item-panel').hidden = !addingItemOpen;
  if (addingItemOpen) document.getElementById('f-name').focus();
});

document.getElementById('add-item-btn').addEventListener('click', addItem);
document.getElementById('f-name').addEventListener('keydown', e => { if (e.key === 'Enter') addItem(); });

document.getElementById('f-qtype').addEventListener('change', e => {
  const isNew = e.target.value === '__new';
  document.getElementById('f-new-qtype-row').hidden = !isNew;
  if (isNew) document.getElementById('f-new-qtype').focus();
});
document.getElementById('save-qtype').addEventListener('click', async () => {
  const input = document.getElementById('f-new-qtype');
  const msgEl = document.getElementById('add-item-msg');
  try {
    const t = await saveQtype(input.value);
    if (!t) return;
    fillQtypeSelect(document.getElementById('f-qtype'));
    document.getElementById('f-qtype').value = String(t.id);
    document.getElementById('f-new-qtype-row').hidden = true;
    input.value = '';
    msgEl.textContent = '✓ unit added: ' + t.name; msgEl.className = 'ok';
  } catch (e) {
    if (e.code === 'auth') { showLogin('session expired — request a new link.', 'err'); return; }
    msgEl.textContent = 'could not add unit: ' + e.message; msgEl.className = 'err';
  }
});

document.getElementById('filters').addEventListener('click', e => {
  const key = e.target.dataset.filter;
  if (!key) return;
  filter = key;
  render();
});

document.getElementById('manage-list').addEventListener('change', e => {
  if (e.target.dataset.act !== 'toggle-hidden') return;
  const id = Number(e.target.dataset.id);
  setHidden(id, !e.target.checked);
});

const listEl = document.getElementById('list');
listEl.addEventListener('click', e => {
  const row = e.target.closest('.card');
  if (!row) return;
  const id = Number(row.dataset.id);

  if (e.target.dataset.act === 'undo') { undoClick(id); return; }
  if (e.target.dataset.act === 'save') { saveItem(id, row); return; }
  if (e.target.dataset.act === 'hide') { hideItem(id); return; }
  if (e.target.dataset.act === 'move') { moveItem(id, Number(e.target.dataset.dir)); return; }
  if (e.target.dataset.act === 'color') { applyRowColor(row, e.target.dataset.color); return; }
  if (e.target.dataset.act === 'save-qtype') {
    const nameInput = row.querySelector('.e-new-qtype');
    saveQtype(nameInput.value).then(t => {
      if (!t) return;
      const sel = row.querySelector('.e-qtype');
      fillQtypeSelect2(sel, t.id);
      row.querySelector('.e-new-qtype-row').hidden = true;
      nameInput.value = '';
    }).catch(err => {
      if (err.code === 'auth') { showLogin('session expired — request a new link.', 'err'); return; }
      setEditMsg(row, 'could not add unit: ' + err.message, 'err');
    });
    return;
  }
  if (e.target.closest('.edit-panel')) return; // clicks inside the form don't toggle/log

  if (editMode) {
    if (expandedEdit.has(id)) expandedEdit.delete(id); else expandedEdit.add(id);
    render();
  } else {
    logClick(id);
  }
});
listEl.addEventListener('change', e => {
  if (!e.target.classList.contains('e-qtype')) return;
  const row = e.target.closest('.card');
  row.querySelector('.e-new-qtype-row').hidden = e.target.value !== '__new';
  if (e.target.value === '__new') row.querySelector('.e-new-qtype').focus();
});

// changing the quantity per click or daily limit restarts a goal's count server-side on save — say so on the button
listEl.addEventListener('input', e => {
  const row = e.target.closest('.card');
  if (e.target.matches('.e-qty, .e-limit')) {
    const item = items.find(i => i.id === Number(row.dataset.id));
    const qtyChanged = row.querySelector('.e-qty').value.trim() !== String(Number(item.quantity_per_click));
    const limitChanged = row.querySelector('.e-limit').value.trim() !== (item.daily_limit != null ? String(item.daily_limit) : '');
    row.querySelector('[data-act="save"]').textContent =
      hasGoal(item) && (qtyChanged || limitChanged) ? 'save & restart countdown' : 'save';
    return;
  }
  if (!e.target.classList.contains('e-color-custom')) return;
  applyRowColor(e.target.closest('.card'), e.target.value);
});

function fillQtypeSelect2(sel, selectId) {
  sel.innerHTML = qtypeOptions(selectId);
}

document.getElementById('login-btn').addEventListener('click', sendLink);
document.getElementById('login-email').addEventListener('keydown', e => { if (e.key === 'Enter') sendLink(); });
document.getElementById('signout').addEventListener('click', () => { NAuth.signOut(); location.reload(); });

/* ---------- start ---------- */

(async function init() {
  const hashError = NAuth.consumeHash();
  if (!NAuth.hasSession()) {
    showLogin(hashError ? 'sign-in failed: ' + hashError : '', hashError ? 'err' : '');
    return;
  }
  try { await NAuth.getToken(); } catch (e) { showLogin('session expired — request a new link.', 'err'); return; }

  document.getElementById('wrap').hidden = false;
  document.getElementById('list').innerHTML = '<div id="loading">loading…</div>';
  try {
    const [qtypeRows, catRows, itemRows] = await Promise.all([
      NAuth.rest('clicker', 'quantity_types?select=id,name&order=name'),
      NAuth.rest('clicker', 'categories?select=id,name&order=sort_order'),
      NAuth.rest('clicker', 'items?select=' + ITEM_COLS + '&order=sort_order.asc.nullslast,created_at'),
    ]);
    qtypes = qtypeRows;
    categories = catRows;
    // every page load opens on "core"; falls back to "all" if that category is gone
    const core = categories.find(c => c.name === 'core');
    filter = core ? String(core.id) : 'all';
    items = itemRows;
    // all of today's logs, plus each gated item's own logs back to where its countdown started
    const todayIso = startOfTodayIso();
    const conds = [`logged_at.gte."${todayIso}"`];
    for (const i of items) {
      if (hasGoal(i)) conds.push(`and(item_id.eq.${i.id},logged_at.gte."${new Date(i.countdown_since).toISOString()}")`);
    }
    const logRows = await NAuth.rest('clicker', 'logs?select=id,item_id,quantity,logged_at&order=logged_at&or=' + encodeURIComponent('(' + conds.join(',') + ')'));
    gateLogs = logRows.map(l => ({ id: l.id, item_id: l.item_id, logged_at: l.logged_at }));
    await loadLastDone(items.filter(isMaintenance).map(i => i.id));
    for (const l of logRows) {
      if (new Date(l.logged_at) >= new Date(todayIso)) todayTotals[l.item_id] = (todayTotals[l.item_id] || 0) + Number(l.quantity);
    }
    render();
  } catch (e) {
    if (e.code === 'auth') { showLogin('session expired — request a new link.', 'err'); return; }
    document.getElementById('list').innerHTML = `<div id="empty">failed to load: ${escapeHtml(e.message)}</div>`;
  }
})();
</script>
